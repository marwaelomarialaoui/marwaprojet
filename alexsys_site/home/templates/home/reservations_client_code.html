{% extends 'home/base.html' %}

{% block content %}
<style>
#reservation-access-container {
    max-width: 400px;
    margin: 80px auto;
    padding: 30px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

#reservation-access-container h2 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 30px;
    font-size: 24px;
}

#reservation-access-container form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

#reservation-access-container label {
    font-weight: bold;
}

#reservation-access-container input[type="password"] {
    padding: 12px 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    width: 100%;
    box-sizing: border-box;
    transition: border-color 0.3s;
}

#reservation-access-container input[type="password"]:focus {
    border-color: #3498db;
    outline: none;
}

#reservation-access-container button {
    padding: 12px 20px;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s;
}

#reservation-access-container button:hover {
    background-color: #2980b9;
}

#reservation-access-container .error {
    color: red;
    text-align: center;
    font-weight: bold;
}
</style>

<div id="reservation-access-container">
<h2>Accès aux réservations</h2>
<p style="color:red;">{{ message_erreur }}</p>
<form method="post">
    {% csrf_token %}
    <label>Code d'accès :</label>
    <input type="password" name="code" required>
    <button type="submit">Valider</button>
</form>
{% endblock %}
