{% extends 'home/base.html' %}
{% load static %}

{% block content %}
<style>
  /* Container centré et propre */
  .container {
    max-width: 1100px;
    margin: 40px auto 70px auto;
    padding: 0 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* Titre centré comme dans ton exemple */
  h1.page-title {
    text-align: center;
    color: #1e3a8a;
    margin-bottom: 50px;
    margin-top: 130px;
    font-size: 32px;
    font-weight: 700;
  }

  /* Conteneur des articles */
  .blog-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 28px;
  }

  /* Carte article */
  .article-card {
    background-color: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.15);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    display: flex;
    flex-direction: column;
  }

  .article-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 16px 48px rgba(37, 99, 235, 0.3);
  }

  /* Image */
  .article-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 5px 22px rgba(37, 99, 235, 0.2);
    transition: transform 0.4s ease;
    cursor: pointer;
  }

  .article-card img:hover {
    transform: scale(1.07);
  }

  /* Titre article */
  .article-card h2 {
    font-size: 24px;
    color: #1e3a8a;
    margin: 14px 0 18px;
    font-weight: 700;
    line-height: 1.2;
  }

  .article-card h2 a {
    text-decoration: none;
    color: inherit;
    transition: color 0.3s ease, text-decoration 0.3s ease;
  }

  .article-card h2 a:hover {
    color: #2563eb;
    text-decoration: underline;
  }

  /* Extrait contenu */
  .article-card p {
    flex-grow: 1;
    color: #4b5563;
    font-size: 16.5px;
    line-height: 1.6;
    margin-bottom: 18px;
    text-align: justify;
  }

  /* Date publication */
  .article-card small {
    color: #6b7280;
    font-style: italic;
    font-size: 14.2px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .blog-container {
      grid-template-columns: 1fr;
    }
    .article-card {
      padding: 22px 16px;
    }
  }
</style>

<div class="container">
  <h1 class="page-title"> Articles &amp; Actualités</h1>

  <div class="blog-container">
    {% for article in articles %}
      <div class="article-card">
        {% if article.image %}
          <img src="{{ article.image.url }}" alt="{{ article.titre }}">
        {% endif %}
        <h2>
          <a href="{% url 'blog_detail' article.id %}">
            {{ article.titre }}
          </a>
        </h2>
        <p>{{ article.contenu|truncatewords:20 }}</p>
        <small> Publié le {{ article.date_pub|date:"d/m/Y H:i" }}</small>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
