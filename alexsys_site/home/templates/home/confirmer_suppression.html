{% extends 'home/base.html' %}
{% block title %}Supprimer Article{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>⚠️ Supprimer l'article</h2>
  <p>Êtes-vous sûr de vouloir supprimer <strong>{{ article.titre }}</strong> ?</p>

  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">🗑 Supprimer</button>
    <a href="{% url 'gerer_blog' %}" class="btn btn-secondary">↩ Annuler</a>
  </form>
</div>
{% endblock %}
