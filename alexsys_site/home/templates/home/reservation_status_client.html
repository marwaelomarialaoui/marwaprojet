<!-- home/templates/home/reservation_status_client.html -->
{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Votre réservation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f4f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            background-color: #fff;
        }
        h1 {
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .reservation-info p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .status-badge {
            padding: 0.5em 1em;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
        }
        .status-Accepted {
            background-color: #22c55e;
            color: #fff;
        }
        .status-Rejected {
            background-color: #ef4444;
            color: #fff;
        }
        .status-Pending {
            background-color: #facc15;
            color: #1f2937;
        }
        .btn-action {
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 500;
            margin-right: 10px;
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: scale(1.05);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            font-weight: 500;
            text-decoration: none;
            color: #1e3a8a;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bonjour {{ reservation.nom }}</h1>

        <div class="reservation-info">
            <p><strong>Objet :</strong> {{ reservation.objet }}</p>
            <p><strong>Date :</strong> {{ reservation.date }}</p>
            <p>
                <strong>Status actuel :</strong>
                <span class="status-badge 
                    {% if reservation.status == 'accepted' %}status-Accepted
                    {% elif reservation.status == 'rejected' %}status-Rejected
                    {% else %}status-Pending{% endif %}">
                    {{ reservation.status|title }}
                </span>
            </p>
        </div>

        {% if message %}
            <p class="text-center mt-3"><strong>{{ message }}</strong></p>
        {% endif %}

        <form method="post" class="text-center mt-4">
            {% csrf_token %}
            <button type="submit" name="action" value="accept" class="btn btn-success btn-action">Accepter ✅</button>
            <button type="submit" name="action" value="reject" class="btn btn-danger btn-action">Refuser ❌</button>
        </form>

        <!-- retour vers la liste des réservations -->
<a href="{% url 'reservations_list' %}" class="back-link">⬅️ Retour à la liste des réservations</a>


    </div>
</body>
</html>
