{% extends 'home/base.html' %}

{% block title %}Envoyer une réponse{% endblock %}

{% block content %}
<style>
  .response-form {
    max-width: 600px;
    margin: 30px auto;
    padding: 25px;
    background-color: #f9f9f9;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    font-family: Arial, sans-serif;
  }
  .response-form h2 {
    text-align: center;
    color: #333;
  }
  .response-form label {
    display: block;
    margin: 15px 0 5px 0;
    font-weight: bold;
    color: #555;
  }
  .response-form textarea {
    width: 100%;
    padding: 10px;
    font-size: 1em;
    border: 1px solid #ccc;
    border-radius: 5px;
    resize: vertical;
    height: 150px;
  }
  .response-form button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    font-size: 1.1em;
    background-color: #4CAF50;
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  .response-form button:hover {
    background-color: #45a049;
  }
  .back-link {
    display: block;
    margin-top: 15px;
    text-align: center;
    color: #888;
    text-decoration: none;
  }
  .back-link:hover {
    text-decoration: underline;
  }
</style>

<div class="response-form">
  <h2>Répondre à   {{ message.nom }}:{{ message.sujet }}</h2>

  {% if messages %}
    {% for msg in messages %}
      <p style="color: {% if msg.tags == 'error' %}red{% else %}green{% endif %}; font-weight: bold;">
        {{ msg }}
      </p>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
  
    <label for="corps">Message :</label>
    <textarea id="corps" name="corps" required></textarea>
    <button type="submit">Envoyer la réponse</button>
  </form>

  <a href="{% url 'messages_contact' %}" class="back-link">← Retour à la liste des messages</a>
</div>
{% endblock %}
