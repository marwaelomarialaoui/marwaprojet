{% extends 'home/base.html' %}

{% block content %}
<style>
     body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #cce6ffff, #f1f3f5ff);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
         h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
.error {
            color: red;
            margin-bottom: 15px;
            font-weight: bold;
        }
         input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="password"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0px 0px 8px rgba(52,152,219,0.5);
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
#admin-access-container {
    max-width: 400px;
    margin: 80px auto;
    padding: 30px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

#admin-access-container h2 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 30px;
    font-size: 24px;
}

#admin-access-container form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

#admin-access-container label {
    font-weight: bold;
    color: #2c3e50;
}

#admin-access-container input[type="password"] {
    padding: 12px 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    width: 100%;
    box-sizing: border-box;
    transition: border-color 0.3s;
}

#admin-access-container input[type="password"]:focus {
    border-color: #3498db;
    outline: none;
}

#admin-access-container button {
    padding: 12px 20px;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s;
}

#admin-access-container button:hover {
    background-color: #2980b9;
}

#admin-access-container .error {
    color: red;
    text-align: center;
    font-weight: bold;
}
</style>

<div id="admin-access-container">
    <h2> Accès au Panel Administrateur</h2>
    {% if message_erreur %}
        <p class="error">{{ message_erreur }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="code">Code d'accès :</label>
        <input type="password" id="code" name="code" required>
        <button type="submit">Valider</button>
    </form>
</div>
{% endblock %}
